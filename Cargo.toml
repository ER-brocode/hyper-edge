[package]
name = "hyper-edge"
version = "0.1.0"
edition = "2021"
authors = ["koushik4475 <koushik4475@gmail.com>"]
description = "Global Anycast Edge Distributed Cache & Reverse Proxy with lock-free eviction, geographic hash ring, and stream pipelining"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ER-brocode/hyper-edge"
keywords = ["edge-computing", "cache", "reverse-proxy", "anycast", "consistent-hashing"]
categories = ["network-programming", "caching", "web-programming::http-server"]

[dependencies]
tokio = { version = "1.38", features = ["full"] }
hyper = { version = "1.4", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
bytes = "1.6"
parking_lot = "0.12"
crossbeam-epoch = "0.9"
crossbeam-queue = "0.3"
dashmap = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
async-trait = "0.1"
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
futures = "0.3"
http = "1.1"

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "hyper-edge"
path = "src/main.rs"

[lib]
name = "hyper_edge"
path = "src/lib.rs"
